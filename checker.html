<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>CureScan</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#EAF1F5;
}

/* NAVBAR */

.navbar{
height:70px;
background:#2F4156;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 40px;
color:white;
}

.logo{
font-size:28px;
font-weight:bold;
display:flex;
align-items:center;
gap:10px;
}

.nav-links{
display:flex;
gap:30px;
}

.nav-links a{
color:white;
text-decoration:none;
font-size:16px;
}

/* MAIN */

.container{
width:90%;
margin:50px auto;
}

.checker-box{
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
display:flex;
justify-content:space-between;
align-items:flex-start;
}

/* LEFT */

.left h1{
font-size:42px;
color:#2F4156;
}

.left p{
margin-top:12px;
font-size:17px;
color:#567C8D;
}

/* RIGHT */

.right{
position:relative;
display:flex;
gap:15px;
align-items:flex-start;
}

/* INPUT */

.input-box{
position:relative;
width:320px;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#F0F4F7;
font-size:16px;
outline:none;
}

/* SUGGESTIONS */

.suggestions{
position:absolute;
top:58px;
left:0;
width:100%;
background:white;
border-radius:14px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
overflow:hidden;
display:none;
z-index:999;
}

.suggestion-item{
padding:14px;
font-size:15px;
color:#7A8B99;
cursor:pointer;
transition:0.2s;
}

.suggestion-item:hover{
background:#F5F8FA;
color:#2F4156;
}

/* BUTTON */

button{
padding:15px 28px;
background:#2F4156;
color:white;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#3D556F;
}

/* RESULT */

#result{
margin-top:35px;
}

.result-card{
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.result-title{
font-size:36px;
color:#2F4156;
margin-bottom:20px;
}

/* FOOTER */

.footer{
background:#2F4156;
margin-top:60px;
padding:30px;
text-align:center;
color:white;
font-size:16px;
}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
<i class="fa-solid fa-shield-heart"></i>
CureScan
</div>

<div class="nav-links">

<a href="">Home</a>
<a href="">Checker</a>
<a href="">Features</a>
<a href="">About</a>

</div>

</div>

<!-- MAIN -->

<div class="container">

<div class="checker-box">

<div class="left">

<h1>
Medicine Safety Checker
</h1>

<p>
Enter a medicine name to check side effects,
allergy risks and interactions.
</p>

</div>

<div class="right">

<div class="input-box">

<input
type="text"
id="medicine"
placeholder="Enter medicine name"
autocomplete="off">

<div
class="suggestions"
id="suggestions">
</div>

</div>

<button onclick="analyzeMedicine()">
Analyze
</button>

</div>

</div>

<div id="result"></div>

</div>

<!-- FOOTER -->

<div class="footer">
CureScan • AI-Powered Health Companion
</div>

<!-- SCRIPT -->

<script>

/* MEDICINE LIST */

const medicines = [
"Paracetamol",
"Ibuprofen",
"Acetaminophen",
"Advil"
];

/* ELEMENTS */

const input =
document.getElementById("medicine");

const suggestions =
document.getElementById("suggestions");

const result =
document.getElementById("result");

/* LIVE SUGGESTIONS */

input.addEventListener("input", function(){

let value =
input.value
.trim()
.toLowerCase();

suggestions.innerHTML = "";

if(value === ""){

suggestions.style.display = "none";
return;

}

let filtered =
medicines.filter(function(med){

return med
.toLowerCase()
.includes(value);

});

if(filtered.length === 0){

suggestions.style.display = "none";
return;

}

filtered.forEach(function(item){

let div =
document.createElement("div");

div.classList.add("suggestion-item");

div.innerText = item;

div.onclick = function(){

input.value = item;

suggestions.style.display = "none";

};

suggestions.appendChild(div);

});

suggestions.style.display = "block";

});

/* HIDE SUGGESTIONS WHEN CLICK OUTSIDE */

document.addEventListener("click", function(e){

if(!e.target.closest(".input-box")){

suggestions.style.display = "none";

}

});

/* ENTER KEY SUPPORT */

input.addEventListener("keydown", function(event){

if(event.key === "Enter"){

event.preventDefault();

analyzeMedicine();

}

});

/* MAIN FUNCTION */

function analyzeMedicine(){

let med =
input.value
.trim()
.toLowerCase();

/* EMPTY INPUT */

if(med === ""){

result.innerHTML = `

<div class="result-card">

<h1 class="result-title">
<i class="fa-solid fa-circle-info"></i>
Enter A Medicine Name
</h1>

<p style="color:#567C8D;font-size:18px;">

Please type a medicine name first.

</p>

</div>

`;

return;

}

/* IBUPROFEN */

if(
med === "ibuprofen" ||
med === "advil"
){

result.innerHTML = `

<div class="result-card">

<h1 class="result-title">
Ibuprofen Analysis
</h1>

<p style="font-size:18px;color:#567C8D;line-height:1.8;">

• Stomach irritation<br>
• Nausea and dizziness<br>
• Avoid alcohol<br>
• Avoid overdose<br>
• Can interact with blood thinners

</p>

</div>

`;

}

/* PARACETAMOL */

else if(
med === "paracetamol" ||
med === "acetaminophen"
){

result.innerHTML = `

<div class="result-card">

<h1 class="result-title">
Paracetamol Analysis
</h1>

<p style="font-size:18px;color:#567C8D;line-height:1.8;">

• Liver damage if overdosed<br>
• Avoid alcohol<br>
• May cause nausea<br>
• Avoid taking excess dosage<br>
• Consult doctor if allergic

</p>

</div>

`;

}

/* NOT FOUND */

else{

result.innerHTML = `

<div class="result-card">

<h1 class="result-title">

<i class="fa-solid fa-circle-xmark"></i>

Medicine Not Found

</h1>

<p style="color:#567C8D;font-size:18px;">

Try:
Paracetamol or Ibuprofen

</p>

</div>

`;

}

}

</script>

</body>
</html>
