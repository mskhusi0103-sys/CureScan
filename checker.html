<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Medicine Checker</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#EAF1F5;
}

/* NAVBAR */

.navbar{
height:70px;
background:#2F4156;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 40px;
color:white;
}

.logo{
font-size:28px;
font-weight:bold;
display:flex;
align-items:center;
gap:10px;
}

.nav-links{
display:flex;
gap:30px;
}

.nav-links a{
color:white;
text-decoration:none;
font-size:16px;
}

/* MAIN */

.container{
width:90%;
margin:50px auto;
}

/* TOP BOX */

.checker-box{
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
display:flex;
justify-content:space-between;
align-items:center;
}

.left h1{
font-size:42px;
color:#2F4156;
}

.left p{
margin-top:12px;
font-size:17px;
color:#567C8D;
}

.right{
display:flex;
gap:15px;
}

input{
width:320px;
padding:15px;
border:none;
border-radius:12px;
background:#F0F4F7;
font-size:16px;
}

button{
padding:15px 28px;
background:#2F4156;
color:white;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
}

/* RESULT */

#result{
margin-top:35px;
}

.result-card{
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.result-title{
font-size:36px;
color:#2F4156;
margin-bottom:25px;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:#F5F8FA;
padding:25px;
border-radius:20px;
}

.card h2{
font-size:24px;
margin-bottom:15px;
color:#2F4156;
display:flex;
align-items:center;
gap:10px;
}

.card p{
font-size:16px;
line-height:1.8;
color:#567C8D;
}

/* WARNING BOX */

.warning-box{
background:#FFEAEA;
border-left:8px solid #E53935;
padding:25px;
margin-top:25px;
border-radius:18px;
display:flex;
gap:20px;
align-items:flex-start;
}

.warning-box i{
font-size:34px;
color:#E53935;
margin-top:5px;
}

.warning-content h2{
font-size:26px;
color:#B71C1C;
margin-bottom:12px;
}

.warning-content p{
font-size:16px;
line-height:1.8;
color:#7A2E2E;
}

/* FOOTER */

.footer{
background:#2F4156;
margin-top:60px;
padding:30px;
text-align:center;
color:white;
font-size:16px;
}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

<div class="logo">
<i class="fa-solid fa-shield-heart"></i>
CureScan
</div>

<div class="nav-links">

<a href="index.html">Home</a>

<a href="checker.html">Checker</a>

<a href="">Features</a>

<a href="">About</a>

</div>

</div>

<!-- MAIN -->

<div class="container">

<div class="checker-box">

<div class="left">

<h1>
Medicine Safety Checker
</h1>

<p>
Enter a medicine name to check side effects,
allergy risks and interactions.
</p>

</div>

<div class="right">

<input
id="medicine"
placeholder="Enter medicine name">

<button onclick="analyzeMedicine()">
Analyze
</button>

</div>

</div>

<!-- RESULT -->

<div id="result"></div>

</div>

<!-- FOOTER -->

<div class="footer">
CureScan • AI-Powered Health Companion
</div>
<!-- SCRIPT -->

<script>

function analyzeMedicine(){

let med =
document.getElementById("medicine")
.value.toLowerCase();

let result =
document.getElementById("result");

/* IBUPROFEN */

if(med=="ibuprofen"){

result.innerHTML = `

<div class="result-card">

<h1 class="result-title">
Ibuprofen Analysis
</h1>

<div class="grid">

<div class="card">

<h2>
<i class="fa-solid fa-triangle-exclamation"></i>
Side Effects
</h2>

<p>
• Stomach pain or irritation<br>
• Nausea and vomiting<br>
• Dizziness or drowsiness<br>
• Headache<br>
• Heartburn or acidity<br>
• Bloating and gas<br>
• Mild skin rash<br>
• Increased blood pressure in some cases<br>
</p>

</div>

<div class="card">

<h2>
<i class="fa-solid fa-burger"></i>
Foods To Avoid
</h2>

<p>
• Alcohol<br>
• Excess spicy foods<br>
• High caffeine intake<br>
• Very salty processed foods<br>
• Grapefruit products<br>
• Heavy oily or fried foods<br>
</p>

</div>

<div class="card">

<h2>
<i class="fa-solid fa-shield-virus"></i>
Allergy Warning
</h2>

<p>
• Avoid if allergic to NSAIDs or aspirin<br>
• May cause skin rash or itching<br>
• Can trigger swelling of face or throat<br>
• Breathing difficulty may occur in severe cases<br>
</p>

</div>

<div class="card">

<h2>
<i class="fa-solid fa-capsules"></i>
Drug Interactions
</h2>

<p>
• Aspirin<br>
• Blood thinners<br>
• Steroids<br>
• Other NSAID medicines<br>
• High blood pressure medicines<br>
• Certain antidepressants<br>
• Kidney-related medications<br>
• Diuretics (water pills)<br>
</p>

</div>

</div>

<div class="warning-box">

<i class="fa-solid fa-triangle-exclamation"></i>

<div class="warning-content">

<h2>Important Warning</h2>

<p>
Do not take Ibuprofen on an empty stomach.
Avoid overdosing as it may cause stomach bleeding,
kidney problems or serious heart complications.
Consult a doctor immediately if severe allergic
reaction, chest pain or breathing difficulty occurs.
Not recommended for people with ulcers,
kidney disease or severe asthma without medical advice.
</p>

</div>

</div>

</div>

`;

}

/* PARACETAMOL */

else if(med=="paracetamol"){

result.innerHTML = `

<div class="result-card">

<h1 class="result-title">
Paracetamol Analysis
</h1>

<div class="grid">

<div class="card">

<h2>
<i class="fa-solid fa-triangle-exclamation"></i>
Side Effects
</h2>

<p>
• Nausea or vomiting<br>
• Headache<br>
• Dizziness<br>
• Mild stomach pain<br>
• Loss of appetite<br>
• Skin rash in rare cases<br>
• Tiredness or weakness<br>
• Liver damage if overdosed<br>
</p>

</div>

<div class="card">

<h2>
<i class="fa-solid fa-burger"></i>
Foods To Avoid
</h2>

<p>
• Alcohol<br>
• Excess fatty foods<br>
• Very sugary drinks<br>
• Excess caffeine<br>
• Herbal supplements without medical advice<br>
• Smoking frequently while medicated<br>
</p>

</div>

<div class="card">

<h2>
<i class="fa-solid fa-shield-virus"></i>
Allergy Warning
</h2>

<p>
• Avoid if allergic to paracetamol or acetaminophen<br>
• May cause skin rash or itching<br>
• Rare allergic swelling may occur<br>
• Stop use if breathing difficulty appears<br>
• Consult a doctor if you have liver disease<br>
• Do not exceed recommended dosage<br>
</p>

</div>

<div class="card">

<h2>
<i class="fa-solid fa-capsules"></i>
Drug Interactions
</h2>

<p>
• Alcohol<br>
• Blood thinners<br>
• Anti-seizure medicines<br>
• Certain antibiotics<br>
• Liver-related medications<br>
• Other medicines containing paracetamol<br>
• Tuberculosis medicines<br>
• Some herbal supplements<br>
</p>

</div>

</div>

<div class="warning-box">

<i class="fa-solid fa-triangle-exclamation"></i>

<div class="warning-content">

<h2>Important Warning</h2>

<p>
Do not exceed the recommended dosage of Paracetamol.
Overdose may lead to severe liver damage or liver failure.
Avoid consuming alcohol while taking this medicine.
Seek immediate medical help if symptoms like yellow skin,
dark urine, breathing difficulty or severe allergic
reaction appear. Use carefully in liver patients.
</p>

</div>

</div>

</div>

`;

}

/* NOT FOUND */

else{

result.innerHTML = `

<div class="result-card">

<h1 class="result-title">

<i class="fa-solid fa-circle-xmark"></i>

Medicine Not Found

</h1>

<p style="color:#567C8D;font-size:18px;">

Try:
Ibuprofen or Paracetamol

</p>

</div>

`;

}

}

</script>
